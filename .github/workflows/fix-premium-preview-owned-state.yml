name: Fix Premium preview owned state

on:
  push:
    branches:
      - design/premium-categories-panel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel

      - name: Persist preview category ownership and hide stale checkmarks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/app/room/[code]/page.tsx')
          s = p.read_text()

          old_effect = '''  useEffect(() => {
    if (!premiumPreviewLockTest) return;
    setActiveCategories((current) => uniqueNonEmpty([...PREMIUM_CATEGORIES, ...current]));
  }, [premiumPreviewLockTest]);'''
          new_effect = '''  useEffect(() => {
    if (!premiumPreviewLockTest) return;
    setActiveCategories((current) => uniqueNonEmpty([...PREMIUM_CATEGORIES, ...current]));

    try {
      const saved = JSON.parse(window.localStorage.getItem("zm_premiumPreviewOwnedCategories") || "[]");
      if (Array.isArray(saved)) {
        setOwnedCategoryProductIds((current) => [
          ...new Set([...current, ...saved.filter((value): value is string => typeof value === "string")]),
        ]);
      }
    } catch {}
  }, [premiumPreviewLockTest]);'''
          if s.count(old_effect) != 1:
            raise SystemExit(f'preview effect matches: {s.count(old_effect)}')
          s = s.replace(old_effect, new_effect)

          old_purchase = '''    if (premiumPreviewLockTest && productId) {
      setOwnedCategoryProductIds((current) => [...new Set([...current, productId])]);
      setActiveCategories((current) => uniqueNonEmpty([...PREMIUM_CATEGORIES, ...current, category]));
      setPremiumLockedOfferCategory(null);
      setMsg(`✅ TEST: ${categoryLabel(category)} odemčeno.`);
      return;
    }'''
          new_purchase = '''    if (premiumPreviewLockTest && productId) {
      setOwnedCategoryProductIds((current) => {
        const next = [...new Set([...current, productId])];
        try {
          window.localStorage.setItem("zm_premiumPreviewOwnedCategories", JSON.stringify(next));
        } catch {}
        return next;
      });
      setActiveCategories((current) => uniqueNonEmpty([...PREMIUM_CATEGORIES, ...current, category]));
      setPremiumLockedOfferCategory(null);
      setMsg(`✅ TEST: ${categoryLabel(category)} odemčeno.`);
      return;
    }'''
          if s.count(old_purchase) != 1:
            raise SystemExit(f'preview purchase matches: {s.count(old_purchase)}')
          s = s.replace(old_purchase, new_purchase)

          old_mark = '''                        border: activeCategories.includes(category)
                          ? "1px solid #2563eb"
                          : "1px solid #767676",
                        background: activeCategories.includes(category) ? "#2563eb" : "#fff",'''
          new_mark = '''                        border: "1px solid #767676",
                        background: "#fff",'''
          # only replace the second occurrence, which is the locked extended-category placeholder
          parts = s.split(old_mark)
          if len(parts) != 3:
            raise SystemExit(f'checkbox fallback matches: {len(parts)-1}')
          s = parts[0] + old_mark + parts[1] + new_mark + parts[2]

          old_tick = '''                      {activeCategories.includes(category) ? "✓" : ""}
                    </span>
                  )}

                    {roomTierForCategoryPreview === "premium" &&'''
          new_tick = '''                      {""}
                    </span>
                  )}

                    {roomTierForCategoryPreview === "premium" &&'''
          if s.count(old_tick) != 1:
            raise SystemExit(f'locked tick matches: {s.count(old_tick)}')
          s = s.replace(old_tick, new_tick)

          p.write_text(s)
          PY

      - name: Validate
        run: git diff --check

      - name: Commit preview-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-premium-preview-owned-state.yml
          git add app/src/app/room/'[code]'/page.tsx
          git commit -m "Fix Premium preview purchased category state"
          git push