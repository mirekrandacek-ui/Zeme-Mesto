name: Apply scoring next round and history tweak

on:
  push:
    branches:
      - design/scoring-next-round-history
    paths:
      - .github/workflows/apply-scoring-next-round-history.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/scoring-next-round-history
      - name: Apply focused patch
        run: python3 scripts/apply_scoring_next_round_history_temp.py
      - name: Validate diff
        run: git diff --check
      - name: Commit focused patch
        run: |
          git rm .github/workflows/apply-scoring-next-round-history.yml scripts/apply_scoring_next_round_history_temp.py
          git add app/src/app/room/'[code]'/page.tsx app/src/app/room/'[code]'/page.module.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Posunout Nové kolo a doladit historii'
          git push origin HEAD:design/scoring-next-round-history
