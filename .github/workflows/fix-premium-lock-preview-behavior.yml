name: Fix Premium lock preview behavior

on:
  push:
    branches:
      - design/premium-categories-panel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel

      - name: Fix preview-only Premium lock test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/app/room/[code]/page.tsx')
          text = path.read_text()

          old = '''  const roomTierForCategoryPreview = premiumPreviewLockTest ? "premium" : roomTier;\n\n  const canEditRoomCategories ='''
          new = '''  const roomTierForCategoryPreview = premiumPreviewLockTest ? "premium" : roomTier;\n\n  useEffect(() => {\n    if (!premiumPreviewLockTest) return;\n    setActiveCategories((current) => uniqueNonEmpty([...PREMIUM_CATEGORIES, ...current]));\n  }, [premiumPreviewLockTest]);\n\n  const canEditRoomCategories ='''
          if text.count(old) != 1:
              raise SystemExit(f'preview tier anchor count: {text.count(old)}')
          text = text.replace(old, new)

          old = '''  async function startCategoryPurchase(category: string) {\n    const productId = CATEGORY_PRODUCT_ID[category];\n\n    if ('''
          new = '''  async function startCategoryPurchase(category: string) {\n    const productId = CATEGORY_PRODUCT_ID[category];\n\n    if (premiumPreviewLockTest && productId) {\n      setOwnedCategoryProductIds((current) => [...new Set([...current, productId])]);\n      setActiveCategories((current) => uniqueNonEmpty([...PREMIUM_CATEGORIES, ...current, category]));\n      setPremiumLockedOfferCategory(null);\n      setMsg(`✅ TEST: ${categoryLabel(category)} odemčeno.`);\n      return;\n    }\n\n    if ('''
          if text.count(old) != 1:
              raise SystemExit(f'purchase anchor count: {text.count(old)}')
          text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Validate
        run: |
          git diff --check
          git diff -- app/src/app/room/'[code]'/page.tsx

      - name: Commit preview-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-premium-lock-preview-behavior.yml
          git add app/src/app/room/'[code]'/page.tsx
          git commit -m "Fix Premium lock preview behavior"
          git push