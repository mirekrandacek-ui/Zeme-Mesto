name: Remove Premium category order

on:
  push:
    branches:
      - design/premium-categories-panel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel

      - name: Restrict category order to Super Premium
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/app/room/[code]/page.tsx')
          s = p.read_text()
          start = s.index('              <h4 style={{ marginTop: 16 }}>\n                {t("categoryOrder")}\n              </h4>')
          end_marker = '              </ol>'
          end = s.index(end_marker, start) + len(end_marker)
          block = s[start:end]
          wrapped = '              {roomTierForCategoryPreview === "super_premium" && (\n                <>\n' + block + '\n                </>\n              )}'
          s = s[:start] + wrapped + s[end:]
          p.write_text(s)
          PY

      - name: Validate
        run: git diff --check

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-premium-category-order.yml
          git add app/src/app/room/'[code]'/page.tsx
          git commit -m "Restrict category order to Super Premium"
          git push
