name: Build unsigned v039 AAB

on:
  push:
    branches:
      - ci/build-v039-aab-20260919

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm dependencies
        working-directory: app
        run: npm ci

      - name: Sync Capacitor Android
        working-directory: app
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android 36 SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned release AAB
        shell: bash
        run: |
          set -euxo pipefail
          sed -i '/signingConfig signingConfigs.release/d' app/android/app/build.gradle
          cd app/android
          chmod +x gradlew
          ./gradlew :app:bundleRelease --console=plain

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: zeme-mesto-v039-unsigned-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
