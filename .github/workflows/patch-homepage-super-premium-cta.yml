name: Patch homepage Super Premium CTA
on:
  push:
    branches: [design/premium-categories-panel]
    paths: [.github/workflows/patch-homepage-super-premium-cta.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch homepage sales copy and preview prices
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/app/page.tsx')
          s=p.read_text()

          replacements=[
          'Super Premium: neomezený počet hráčů, základní kategorie a hned navíc Film / Seriál, Sport, Značka a Auto / Moto. Pravidelným hraním získáváš coiny, za které můžeš odemknout další kategorie: Herec / Herečka, Zpěvák / Zpěvačka / Kapela, Řeka / Hora, Povolání a Barva. Za coiny odemkneš také pořadí kategorií, časový limit, vlastní počet kol a vlastní kategorie.',
          'Super Premium: unlimited players, all basic categories, plus Film / Series, Sport, Brand and Car / Motorbike right away. Regular play earns you coins that can unlock more categories: Actor / Actress, Singer / Band, River / Mountain, Job and Colour. Coins can also unlock category ordering, a time limit, custom round count and custom categories.',
          'Super Premium: jugadores ilimitados, todas las categorías básicas y, desde el principio, Película / Serie, Deporte, Marca y Coche / Moto. Jugando con regularidad ganas monedas para desbloquear más categorías: Actor / Actriz, Cantante / Grupo, Río / Montaña, Profesión y Color. Con monedas también puedes desbloquear el orden de categorías, límite de tiempo, número personalizado de rondas y categorías propias.',
          'Super Premium: unbegrenzt viele Spieler, alle Grundkategorien und sofort zusätzlich Film / Serie, Sportart, Marke und Auto / Motorrad. Durch regelmäßiges Spielen verdienst du Coins, mit denen du weitere Kategorien freischalten kannst: Schauspieler / Schauspielerin, Sänger / Sängerin / Band, Fluss / Berg, Beruf und Farbe. Mit Coins lassen sich außerdem Kategorienreihenfolge, Zeitlimit, eigene Rundenzahl und eigene Kategorien freischalten.',
          'Super Premium : joueurs illimités, toutes les catégories de base, plus dès le départ Film / Série, Sport, Marque et Voiture / Moto. En jouant régulièrement, tu gagnes des pièces pour débloquer d’autres catégories : Acteur / Actrice, Chanteur / Groupe, Fleuve / Montagne, Métier et Couleur. Les pièces permettent aussi de débloquer l’ordre des catégories, une limite de temps, un nombre de manches personnalisé et des catégories personnalisées.',
          'Super Premium: jogadores ilimitados, todas as categorias básicas e, desde o início, Filme / Série, Esporte, Marca e Carro / Moto. Jogando regularmente, você ganha moedas para desbloquear mais categorias: Ator / Atriz, Cantor / Banda, Rio / Montanha, Profissão e Cor. As moedas também desbloqueiam a ordem das categorias, limite de tempo, número personalizado de rodadas e categorias próprias.',
          'Super Premium: pemain tanpa batas, semua kategori dasar, ditambah langsung Film / Serial, Olahraga, Merek, dan Mobil / Motor. Dengan bermain rutin, kamu mendapatkan koin untuk membuka kategori lain: Aktor / Aktris, Penyanyi / Band, Sungai / Gunung, Pekerjaan, dan Warna. Koin juga dapat membuka urutan kategori, batas waktu, jumlah ronde khusus, dan kategori buatan sendiri.',
          'Super Premium: sınırsız oyuncu, tüm temel kategoriler ve hemen Film / Dizi, Spor, Marka ve Araba / Motosiklet. Düzenli oynayarak kazanılan coinlerle Aktör / Aktris, Şarkıcı / Grup, Nehir / Dağ, Meslek ve Renk gibi diğer kategorilerin kilidini açabilirsin. Coinlerle kategori sıralaması, süre sınırı, özel tur sayısı ve özel kategoriler de açılabilir.',
          'Super Premium: nieograniczona liczba graczy, wszystkie kategorie podstawowe oraz od razu Film / Serial, Sport, Marka i Samochód / Motocykl. Za regularną grę zdobywasz monety, którymi odblokujesz kolejne kategorie: Aktor / Aktorka, Piosenkarz / Zespół, Rzeka / Góra, Zawód i Kolor. Monety pozwalają też odblokować kolejność kategorii, limit czasu, własną liczbę rund i własne kategorie.',
          'Super Premium: giocatori illimitati, tutte le categorie base e subito anche Film / Serie TV, Sport, Marca e Auto / Moto. Giocando regolarmente guadagni monete con cui sbloccare altre categorie: Attore / Attrice, Cantante / Gruppo, Fiume / Montagna, Professione e Colore. Con le monete puoi anche sbloccare l’ordine delle categorie, il limite di tempo, un numero personalizzato di turni e categorie personalizzate.'
          ]

          pattern=r'(superPremiumPurchaseDescription:\s*\n?\s*)"[^"]*"'
          matches=list(re.finditer(pattern,s))
          if len(matches)!=10:
              raise SystemExit(f'expected 10 superPremiumPurchaseDescription entries, got {len(matches)}')
          out=[]; pos=0
          for m,new in zip(matches,replacements):
              out.append(s[pos:m.start()]); out.append(m.group(1)+'"'+new+'"'); pos=m.end()
          out.append(s[pos:]); s=''.join(out)

          old='''  const premiumPrice =\n    billingProducts.find((product) => product.productId === "premium")\n      ?.formattedPrice;'''
          new='''  const premiumPrice =\n    billingProducts.find((product) => product.productId === "premium")\n      ?.formattedPrice;\n\n  const isVercelPreview =\n    typeof window !== "undefined" && window.location.hostname.endsWith("vercel.app");\n  const premiumDisplayPrice = premiumPrice ?? (isVercelPreview ? "69 Kč" : undefined);'''
          if old not in s: raise SystemExit('premium price block not found')
          s=s.replace(old,new,1)

          old='''  const superPremiumPrice =\n    superPremiumProduct?.formattedPrice;'''
          new='''  const superPremiumPrice =\n    superPremiumProduct?.formattedPrice;\n  const superPremiumDisplayPrice =\n    superPremiumPrice ?? (isVercelPreview ? "129 Kč" : undefined);'''
          if old not in s: raise SystemExit('super premium price block not found')
          s=s.replace(old,new,1)

          s=s.replace('''<article><h3>Premium{premiumPrice ? ` – ${premiumPrice}` : ""}</h3>''','''<article><h3>Premium{premiumDisplayPrice ? ` – ${premiumDisplayPrice}` : ""}</h3>''',1)
          s=s.replace('''<article><h3>Super Premium{superPremiumPrice ? ` – ${superPremiumPrice}` : ""}</h3><p>{h("superPremiumPurchaseDescription")}</p><p>{h("superPremiumCategories")}</p>''','''<article><h3>Super Premium{superPremiumDisplayPrice ? ` – ${superPremiumDisplayPrice}` : ""}</h3><p>{h("superPremiumPurchaseDescription")}</p>''',1)

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/app/page.tsx
          git commit -m 'Improve Super Premium homepage CTA' || exit 0
          git push
