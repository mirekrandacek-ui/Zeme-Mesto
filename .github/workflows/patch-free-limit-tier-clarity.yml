name: Fix Polish Super Premium coin copy
on:
  push:
    branches: [fix/free-limit-tier-clarity]
    paths: [.github/workflows/patch-free-limit-tier-clarity.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/free-limit-tier-clarity
      - name: Fix Polish copy
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ['app/src/app/page.tsx', 'app/src/app/room/[code]/uiText.ts']:
              p = Path(path)
              s = p.read_text()
              old = 'Regularnie grając w trybie Super Premium, zdobywasz monety, za které otrzymujesz kolejne korzyści w grze:'
              new = 'Regularnie grając w trybie Super Premium, zdobywasz monety, za które otrzymujesz kolejne korzyści w grze:'
              if old not in s:
                  raise SystemExit(f'Polish typo not found in {path}')
              p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/app/page.tsx app/src/app/room/[code]/uiText.ts
          git commit -m 'Fix Polish Super Premium coin copy'
          git push