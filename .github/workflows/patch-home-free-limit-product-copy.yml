name: Patch homepage Free limit product copy
on:
  push:
    branches: [design/premium-categories-panel]
    paths: [.github/workflows/patch-home-free-limit-product-copy.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel
      - name: Add Premium and Super Premium descriptions to homepage Free limit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/app/page.tsx')
          s = p.read_text()

          premium_pattern = re.compile(r'(<button\s+type="button"\s+disabled=\{purchaseBusy !== null\}\s+onClick=\{\(\) => void startPlayPurchase\("premium"\)\}\s*>\s*\{h\("buyPremium"\)\}\s*</button>)')
          s, n = premium_pattern.subn(r'''\1
              <p>{h("premiumDescription")}</p>''', s, count=1)
          if n != 1:
              raise SystemExit(f'Premium homepage Free-limit button replacements: {n}')

          super_pattern = re.compile(r'(<button\s+type="button"\s+disabled=\{purchaseBusy !== null\}\s+onClick=\{\(\) => void startPlayPurchase\("super_premium"\)\}\s+style=\{\{ marginTop: 10 \}\}\s*>\s*\{h\("buySuperPremium"\)\}\s*</button>)')
          super_copy = r'''\1
              <p>{h("superPremiumPurchaseDescription")}</p>
              <p>{h("superPremiumBenefitsIntro")}</p>
              <ul>
                {h("superPremiumBenefits").split("|").map((benefit) => (
                  <li key={benefit}>{benefit}</li>
                ))}
              </ul>'''
          s, n = super_pattern.subn(super_copy, s, count=1)
          if n != 1:
              raise SystemExit(f'Super Premium homepage Free-limit button replacements: {n}')

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/app/page.tsx
          git commit -m 'Show product details in homepage Free limit' || exit 0
          git push