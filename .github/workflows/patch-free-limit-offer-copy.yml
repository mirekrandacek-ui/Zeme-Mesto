name: Patch Free limit offer copy
on:
  push:
    branches: [design/premium-categories-panel]
    paths: [.github/workflows/patch-free-limit-offer-copy.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel
      - name: Update Free limit Premium and Super Premium copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/app/room/[code]/page.tsx')
          s=p.read_text()

          repl={
            'Premium: max. 5 hráčů a základní kategorie Země, Město, Jméno, Zvíře, Věc a Rostlina.':'Až 5 hráčů a pevné základní kategorie: Země, Město, Jméno, Zvíře, Věc a Rostlina.',
            'Premium: up to 5 players and the basic categories Country, City, Name, Animal, Thing and Plant.':'Up to 5 players and fixed basic categories: Country, City, Name, Animal, Thing and Plant.',
            'Premium: hasta 5 jugadores y las categorías básicas País, Ciudad, Nombre, Animal, Cosa y Planta.':'Hasta 5 jugadores y categorías básicas fijas: País, Ciudad, Nombre, Animal, Cosa y Planta.',
            'Premium: bis zu 5 Spieler und die Grundkategorien Land, Stadt, Name, Tier, Gegenstand und Pflanze.':'Bis zu 5 Spieler und feste Grundkategorien: Land, Stadt, Name, Tier, Gegenstand und Pflanze.',
            'Premium : jusqu’à 5 joueurs et les catégories de base Pays, Ville, Prénom, Animal, Objet et Plante.':'Jusqu’à 5 joueurs et catégories de base fixes : Pays, Ville, Prénom, Animal, Objet et Plante.',
            'Premium: até 5 jogadores e as categorias básicas País, Cidade, Nome, Animal, Objeto e Planta.':'Até 5 jogadores e categorias básicas fixas: País, Cidade, Nome, Animal, Objeto e Planta.',
            'Premium: hingga 5 pemain dan kategori dasar Negara, Kota, Nama, Hewan, Benda, dan Tumbuhan.':'Hingga 5 pemain dan kategori dasar tetap: Negara, Kota, Nama, Hewan, Benda, dan Tumbuhan.',
            'Premium: en fazla 5 oyuncu ve temel kategoriler Ülke, Şehir, İsim, Hayvan, Eşya ve Bitki.':'En fazla 5 oyuncu ve sabit temel kategoriler: Ülke, Şehir, İsim, Hayvan, Eşya ve Bitki.',
            'Premium: maks. 5 graczy i podstawowe kategorie Państwo, Miasto, Imię, Zwierzę, Rzecz i Roślina.':'Do 5 graczy i stałe kategorie podstawowe: Państwo, Miasto, Imię, Zwierzę, Rzecz i Roślina.',
            'Premium: fino a 5 giocatori e categorie base Paese, Città, Nome, Animale, Oggetto e Pianta.':'Fino a 5 giocatori e categorie base fisse: Paese, Città, Nome, Animale, Oggetto e Pianta.'
          }
          for old,new in repl.items():
              if old not in s:
                  raise SystemExit('missing Premium copy: '+old)
              s=s.replace(old,new,1)

          start=s.index('                  <p style={{ margin: "6px 2px 0", fontSize: 13, lineHeight: 1.35 }}>\n                    {uiMessage({\n                      cs: "Super Premium: neomezený počet hráčů')
          end=s.index('                  </p>', start)+len('                  </p>')
          new='''                  <p style={{ margin: "6px 2px 0", fontSize: 13, lineHeight: 1.35 }}>
                    {uiMessage({
                      cs: "Neomezený počet hráčů, základní kategorie a 4 rozšířené kategorie Film / Seriál, Sport, Značka a Auto / Moto.",
                      en: "Unlimited players, all basic categories and 4 extended categories: Film / Series, Sport, Brand and Car / Motorbike.",
                      es: "Jugadores ilimitados, todas las categorías básicas y 4 categorías ampliadas: Película / Serie, Deporte, Marca y Coche / Moto.",
                      de: "Unbegrenzt viele Spieler, alle Grundkategorien und 4 erweiterte Kategorien: Film / Serie, Sportart, Marke und Auto / Motorrad.",
                      fr: "Nombre de joueurs illimité, toutes les catégories de base et 4 catégories supplémentaires : Film / Série, Sport, Marque et Voiture / Moto.",
                      "pt-BR": "Jogadores ilimitados, todas as categorias básicas e 4 categorias adicionais: Filme / Série, Esporte, Marca e Carro / Moto.",
                      id: "Pemain tanpa batas, semua kategori dasar, serta 4 kategori tambahan: Film / Serial, Olahraga, Merek, dan Mobil / Motor.",
                      tr: "Sınırsız oyuncu, tüm temel kategoriler ve 4 ek kategori: Film / Dizi, Spor, Marka ve Araba / Motosiklet.",
                      pl: "Nieograniczona liczba graczy, wszystkie kategorie podstawowe oraz 4 kategorie rozszerzone: Film / Serial, Sport, Marka i Samochód / Motocykl.",
                      it: "Giocatori illimitati, tutte le categorie base e 4 categorie estese: Film / Serie TV, Sport, Marca e Auto / Moto.",
                    })}
                  </p>
                  <p style={{ margin: "8px 2px 4px", fontSize: 13, lineHeight: 1.35 }}>
                    {t("superPremiumBenefitsIntro")}
                  </p>
                  <ul style={{ margin: "0 2px 8px 20px", padding: 0, fontSize: 13, lineHeight: 1.35 }}>
                    {t("superPremiumBenefits").split("|").map((benefit) => (
                      <li key={benefit}>{benefit}</li>
                    ))}
                  </ul>'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/app/room/[code]/page.tsx
          git commit -m 'Update Free limit purchase copy' || exit 0
          git push
