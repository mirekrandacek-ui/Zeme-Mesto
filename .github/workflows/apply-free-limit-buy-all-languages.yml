name: Apply Free limit buy wording
on:
  push:
    branches:
      - design/free-limit-back-home-buy-copy
    paths:
      - '.github/workflows/apply-free-limit-buy-all-languages.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/free-limit-back-home-buy-copy
      - name: Apply focused patch
        run: python .tmp/patch_free_limit_buy_all_languages.py
      - name: Validate diff
        run: |
          git diff --check
          git diff -- app/src/app/room/'[code]'/page.tsx app/src/app/room/'[code]'/uiText.ts
      - name: Commit focused patch
        run: |
          rm .tmp/patch_free_limit_buy_all_languages.py
          rm .github/workflows/apply-free-limit-buy-all-languages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/app/room/'[code]'/page.tsx app/src/app/room/'[code]'/uiText.ts .tmp/patch_free_limit_buy_all_languages.py .github/workflows/apply-free-limit-buy-all-languages.yml
          git commit -m 'Doladit nákupní texty a rozestup tlačítka Zpět'
          git push origin HEAD:design/free-limit-back-home-buy-copy
