name: Patch Super Premium bullet font parity
on:
  push:
    branches: [design/premium-categories-panel]
    paths: [.github/workflows/patch-super-premium-bullet-font-2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel
      - name: Match bullet text to purchase copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/app/page.module.css')
          s=p.read_text()
          old='.purchaseOptions ul{font-size:10px;line-height:1.25}.purchaseOptions li{font-size:inherit;line-height:inherit}'
          new='.purchaseOptions ul{font-size:11.5px;line-height:1.35}.purchaseOptions li{font-size:inherit;line-height:inherit}'
          if old not in s:
              raise SystemExit('old bullet style not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/app/page.module.css
          git commit -m 'Match Super Premium bullets to copy size' || exit 0
          git push
