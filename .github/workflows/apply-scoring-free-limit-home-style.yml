name: Apply scoring Free limit homepage style

on:
  push:
    branches:
      - design/scoring-free-limit-home-style
    paths:
      - .github/workflows/apply-scoring-free-limit-home-style.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/scoring-free-limit-home-style
      - name: Apply focused patch
        run: python3 .github/scripts/apply-scoring-free-limit-home-style.py
      - name: Validate diff
        run: git diff --check
      - name: Commit focused patch
        run: |
          git rm .github/workflows/apply-scoring-free-limit-home-style.yml .github/scripts/apply-scoring-free-limit-home-style.py
          git add app/src/app/room/'[code]'/page.tsx app/src/app/room/'[code]'/page.module.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sjednotit Free limit box s homepage'
          git push origin HEAD:design/scoring-free-limit-home-style
