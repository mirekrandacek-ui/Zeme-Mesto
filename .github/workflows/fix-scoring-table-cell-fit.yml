name: Fix scoring table cell fit
on:
  push:
    branches: [fix/scoring-table-cell-fit]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scoring-table-cell-fit
      - name: Make scoring cells fit their content
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/app/room/[code]/page.module.css')
          s = p.read_text()

          old_cell = '''.scoringTableCell{
  width:auto;
  max-width:none;
  padding:6px 8px;'''
          new_cell = '''.scoringTableCell{
  width:auto;
  max-width:none;
  white-space:nowrap;
  padding:6px 8px;'''
          if old_cell not in s:
            raise SystemExit('scoringTableCell target not found')
          s = s.replace(old_cell, new_cell, 1)

          old_total = '''.scoringTotalPointsText{
  display:inline-block;
  max-width:4.8em;
  white-space:normal;
  line-height:1.05;
}'''
          new_total = '''.scoringTotalPointsText{
  display:inline-block;
  max-width:none;
  white-space:nowrap;
  line-height:1.05;
}'''
          if old_total not in s:
            raise SystemExit('scoringTotalPointsText target not found')
          s = s.replace(old_total, new_total, 1)

          p.write_text(s)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'app/src/app/room/[code]/page.module.css'
          git commit -m 'Keep scoring table text inside cells'
          git push
