name: Hide duplicate free limit

on:
  push:
    branches:
      - design/game-screen-unified

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/game-screen-unified
      - name: Apply patch
        run: python scripts/hide-duplicate-free-limit-temp.py
      - name: Commit source changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/src/app/page.tsx'
          git rm scripts/hide-duplicate-free-limit-temp.py .github/workflows/hide-duplicate-free-limit-temp.yml
          git commit -m 'Skrýt duplicitní hlášku Free limitu'
          git push origin HEAD:design/game-screen-unified
