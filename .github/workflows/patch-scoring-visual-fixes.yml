name: Patch scoring visual fixes
on:
  push:
    branches: [fix/scoring-free-limit-and-table-fit]
    paths: [.github/workflows/patch-scoring-visual-fixes.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scoring-free-limit-and-table-fit
      - name: Fix scoring Free limit typography and table sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/app/room/[code]/page.module.css')
          s = p.read_text()

          old = '''.scoringFreeLimitPanel{\n  padding:8px;\n  border:1.5px solid #ffd75d;\n  border-radius:10px;\n  color:#fff;\n  background:#513100cf;\n  font-size:10px;\n  line-height:1.3;\n  text-shadow:0 2px 3px #00152d;\n}'''
          new = old.replace('font-size:10px;', 'font-size:11.5px;').replace('line-height:1.3;', 'line-height:1.35;')
          if old not in s:
              raise SystemExit('scoringFreeLimitPanel block not found')
          s = s.replace(old, new, 1)

          old = '''.scoringFreeLimitPanel>button:not(:last-child){\n  width:100%;\n  border:1px solid #b8ff8c;\n  border-radius:9px;\n  color:#fff;\n  background:linear-gradient(#67ca35,#21880d);\n  font:inherit;\n  font-size:11px;\n  font-weight:800;\n  text-shadow:0 2px 2px #145c0d;\n}'''
          new = old.replace('font-size:11px;', 'font-size:13px;')
          if old not in s:
              raise SystemExit('scoring Free limit button block not found')
          s = s.replace(old, new, 1)

          old = '''.scoringTableCell{\n  width:auto;\n  max-width:none;\n  padding:6px 8px;\n  border:1px solid #c8d6e2;\n  background:#fff;\n  white-space:nowrap;\n}'''
          new = '''.scoringTableCell{\n  width:auto;\n  max-width:none;\n  padding:6px 8px;\n  border:1px solid #c8d6e2;\n  background:#fff;\n  white-space:nowrap;\n  overflow-wrap:normal;\n  word-break:normal;\n}'''
          if old not in s:
              raise SystemExit('scoringTableCell block not found')
          s = s.replace(old, new, 1)

          old = '''.scoringTotalPointsText{\n  display:inline-block;\n  max-width:4.8em;\n  white-space:normal;\n  line-height:1.05;\n}'''
          new = '''.scoringTotalPointsText{\n  display:inline;\n  max-width:none;\n  white-space:nowrap;\n  line-height:inherit;\n}'''
          if old not in s:
              raise SystemExit('scoringTotalPointsText block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'app/src/app/room/[code]/page.module.css'
          git commit -m 'Fix scoring Free limit text and table cell sizing'
          git push