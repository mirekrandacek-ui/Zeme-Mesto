name: Patch homepage sales copy tune
on:
  push:
    branches: [design/premium-categories-panel]
    paths: [.github/workflows/patch-homepage-copy-tune.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Tune homepage Premium and Super Premium copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/app/page.tsx')
          s=p.read_text()

          premium_replacements=[
            'Až 5 hráčů. Pevně dané základní kategorie: Země, Město, Jméno, Zvíře, Věc, Rostlina.',
            'Up to 5 players. Fixed basic categories: Country, City, Name, Animal, Thing, Plant.',
            'Hasta 5 jugadores. Categorías básicas fijas: País, Ciudad, Nombre, Animal, Cosa, Planta.',
            'Bis zu 5 Spieler. Feste Grundkategorien: Land, Stadt, Name, Tier, Gegenstand, Pflanze.',
            'Jusqu’à 5 joueurs. Catégories de base fixes : Pays, Ville, Prénom, Animal, Objet, Plante.',
            'Até 5 jogadores. Categorias básicas fixas: País, Cidade, Nome, Animal, Objeto, Planta.',
            'Hingga 5 pemain. Kategori dasar tetap: Negara, Kota, Nama, Hewan, Benda, Tanaman.',
            '5 oyuncuya kadar. Sabit temel kategoriler: Ülke, Şehir, İsim, Hayvan, Eşya, Bitki.',
            'Do 5 graczy. Stałe kategorie podstawowe: Kraj, Miasto, Imię, Zwierzę, Rzecz, Roślina.',
            'Fino a 5 giocatori. Categorie base fisse: Paese, Città, Nome, Animale, Oggetto, Pianta.'
          ]

          super_replacements=[
            'Neomezený počet hráčů, základní kategorie a 4 rozšířené kategorie Film / Seriál, Sport, Značka a Auto / Moto. Pravidelným hraním získáváš coiny, za které můžeš odemknout další kategorie: Herec / Herečka, Zpěvák / Zpěvačka / Kapela, Řeka / Hora, Povolání a Barva. Za coiny také odemkneš možnost vlastního pořadí kategorií, časový limit, nastavení počtu kol a možnost vytvořit si vlastní kategorie.',
            'Unlimited players, all basic categories and 4 extended categories: Film / Series, Sport, Brand and Car / Motorbike. Regular play earns you coins that can unlock more categories: Actor / Actress, Singer / Band, River / Mountain, Job and Colour. Coins also unlock custom category ordering, a time limit, round-count settings and the option to create custom categories.',
            'Jugadores ilimitados, todas las categorías básicas y 4 categorías ampliadas: Película / Serie, Deporte, Marca y Coche / Moto. Jugando con regularidad ganas monedas para desbloquear más categorías: Actor / Actriz, Cantante / Grupo, Río / Montaña, Profesión y Color. Con monedas también desbloqueas el orden personalizado de categorías, límite de tiempo, ajuste del número de rondas y la posibilidad de crear categorías propias.',
            'Unbegrenzt viele Spieler, alle Grundkategorien und 4 erweiterte Kategorien: Film / Serie, Sportart, Marke und Auto / Motorrad. Durch regelmäßiges Spielen verdienst du Coins, mit denen du weitere Kategorien freischalten kannst: Schauspieler / Schauspielerin, Sänger / Sängerin / Band, Fluss / Berg, Beruf und Farbe. Mit Coins schaltest du außerdem eine eigene Kategorienreihenfolge, Zeitlimit, Rundenzahl-Einstellung und eigene Kategorien frei.',
            'Nombre de joueurs illimité, toutes les catégories de base et 4 catégories supplémentaires : Film / Série, Sport, Marque et Voiture / Moto. En jouant régulièrement, tu gagnes des pièces pour débloquer d’autres catégories : Acteur / Actrice, Chanteur / Groupe, Fleuve / Montagne, Métier et Couleur. Les pièces permettent aussi de débloquer un ordre personnalisé des catégories, une limite de temps, le réglage du nombre de manches et la création de catégories personnalisées.',
            'Jogadores ilimitados, todas as categorias básicas e 4 categorias adicionais: Filme / Série, Esporte, Marca e Carro / Moto. Jogando regularmente, você ganha moedas para desbloquear mais categorias: Ator / Atriz, Cantor / Banda, Rio / Montanha, Profissão e Cor. As moedas também desbloqueiam ordem personalizada das categorias, limite de tempo, configuração do número de rodadas e a opção de criar categorias próprias.',
            'Pemain tanpa batas, semua kategori dasar dan 4 kategori tambahan: Film / Serial, Olahraga, Merek, dan Mobil / Motor. Dengan bermain rutin, kamu mendapatkan koin untuk membuka kategori lain: Aktor / Aktris, Penyanyi / Band, Sungai / Gunung, Pekerjaan, dan Warna. Koin juga membuka urutan kategori khusus, batas waktu, pengaturan jumlah ronde, dan opsi membuat kategori sendiri.',
            'Sınırsız oyuncu, tüm temel kategoriler ve 4 ek kategori: Film / Dizi, Spor, Marka ve Araba / Motosiklet. Düzenli oynayarak kazanılan coinlerle Aktör / Aktris, Şarkıcı / Grup, Nehir / Dağ, Meslek ve Renk gibi diğer kategorilerin kilidini açabilirsin. Coinlerle ayrıca özel kategori sıralaması, süre sınırı, tur sayısı ayarı ve özel kategori oluşturma özelliği açılır.',
            'Nieograniczona liczba graczy, wszystkie kategorie podstawowe oraz 4 kategorie rozszerzone: Film / Serial, Sport, Marka i Samochód / Motocykl. Za regularną grę zdobywasz monety, którymi odblokujesz kolejne kategorie: Aktor / Aktorka, Piosenkarz / Zespół, Rzeka / Góra, Zawód i Kolor. Monety pozwalają też odblokować własną kolejność kategorii, limit czasu, ustawienie liczby rund i możliwość tworzenia własnych kategorii.',
            'Giocatori illimitati, tutte le categorie base e 4 categorie estese: Film / Serie TV, Sport, Marca e Auto / Moto. Giocando regolarmente guadagni monete con cui sbloccare altre categorie: Attore / Attrice, Cantante / Gruppo, Fiume / Montagna, Professione e Colore. Con le monete puoi anche sbloccare un ordine personalizzato delle categorie, il limite di tempo, l’impostazione del numero di turni e la possibilità di creare categorie personalizzate.'
          ]

          for key,repls in [('premiumDescription', premium_replacements), ('superPremiumPurchaseDescription', super_replacements)]:
              pat=rf'({key}:\s*\n?\s*)"[^"]*"'
              ms=list(re.finditer(pat,s))
              if len(ms)!=10:
                  raise SystemExit(f'expected 10 {key} entries, got {len(ms)}')
              out=[]; pos=0
              for m,new in zip(ms,repls):
                  out.append(s[pos:m.start()]); out.append(m.group(1)+'"'+new+'"'); pos=m.end()
              out.append(s[pos:]); s=''.join(out)

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/app/page.tsx
          git commit -m 'Tune homepage Premium and Super Premium copy' || exit 0
          git push
