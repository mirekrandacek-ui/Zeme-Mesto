name: Patch tier loading guard
on:
  push:
    branches: [design/premium-categories-panel]
    paths: [.github/workflows/patch-tier-loading-guard.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel
      - name: Prevent Free flash before entitlement resolves
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/app/page.tsx')
          s = p.read_text()

          old = '  const [billingReady, setBillingReady] = useState(false);\n'
          new = old + '  const [tierResolved, setTierResolved] = useState(false);\n'
          if old not in s:
              raise SystemExit('billingReady state not found')
          s = s.replace(old, new, 1)

          old = '''  useEffect(() => {\n    if (!isPlayBillingAvailable()) return;\n\n    async function loadPlayBilling() {\n      try {\n        const connection = await PlayBilling.connect();\n        if (!connection.ready) return;\n'''
          new = '''  useEffect(() => {\n    if (!isPlayBillingAvailable()) {\n      setTierResolved(true);\n      return;\n    }\n\n    async function loadPlayBilling() {\n      try {\n        const connection = await PlayBilling.connect();\n        if (!connection.ready) {\n          setTierResolved(true);\n          return;\n        }\n'''
          if old not in s:
              raise SystemExit('billing effect start not found')
          s = s.replace(old, new, 1)

          old = '''        if (ownedProducts.has("super_premium")) {\n          setTier("super_premium");\n        } else if (ownedProducts.has("premium")) {\n          setTier("premium");\n        }\n\n        for (const purchaseToken of purchaseTokensToAcknowledge) {\n'''
          new = '''        if (ownedProducts.has("super_premium")) {\n          setTier("super_premium");\n        } else if (ownedProducts.has("premium")) {\n          setTier("premium");\n        }\n\n        setTierResolved(true);\n\n        for (const purchaseToken of purchaseTokensToAcknowledge) {\n'''
          if old not in s:
              raise SystemExit('owned tier block not found')
          s = s.replace(old, new, 1)

          old = '''      } catch (error) {\n        console.error("Google Play Billing init failed:", error);\n      }\n'''
          new = '''      } catch (error) {\n        console.error("Google Play Billing init failed:", error);\n        setTierResolved(true);\n      }\n'''
          if old not in s:
              raise SystemExit('billing catch not found')
          s = s.replace(old, new, 1)

          old = '    <main className={styles.homepage}>\n'
          new = '''    <main className={styles.homepage}>\n      {!tierResolved && (\n        <div\n          aria-busy="true"\n          aria-label="Loading"\n          style={{\n            position: "fixed",\n            inset: 0,\n            zIndex: 10000,\n            background: "#001a33",\n          }}\n        />\n      )}\n'''
          if old not in s:
              raise SystemExit('homepage main not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/app/page.tsx
          git commit -m 'Prevent Free flash before entitlement resolves' || exit 0
          git push
