name: Patch Premium lock state

on:
  push:
    branches: ["design/premium-categories-panel"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel
      - name: Patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/app/room/[code]/page.tsx")
          s = p.read_text()
          old = """  useEffect(() => {
    if (!premiumPreviewLockTest) return;
    setActiveCategories((current) => uniqueNonEmpty([...PREMIUM_CATEGORIES, ...current]));
  }, [premiumPreviewLockTest]);"""
          new = """  useEffect(() => {
    if (!premiumPreviewLockTest) return;
    setActiveCategories((current) =>
      uniqueNonEmpty([
        ...PREMIUM_CATEGORIES,
        ...current.filter((category) =>
          ownedCategoryProductIds.includes(CATEGORY_PRODUCT_ID[category])
        ),
      ])
    );
  }, [premiumPreviewLockTest, ownedCategoryProductIds]);"""
          if old not in s:
              raise SystemExit("target block not found")
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/app/room/'[code]'/page.tsx
          git commit -m "Fix locked category state in Premium preview"
          git push