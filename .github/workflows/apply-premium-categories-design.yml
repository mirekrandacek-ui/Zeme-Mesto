name: Apply Premium categories design

on:
  push:
    branches:
      - design/premium-categories-panel

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel

      - name: Apply focused categories panel redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          page = Path('app/src/app/room/[code]/page.tsx')
          css = Path('app/src/app/room/[code]/page.module.css')

          text = page.read_text()
          old = '            <section style={{ border: "1px solid #ddd", borderRadius: 8, padding: 12, marginTop: 16 }}>'
          new = '''            <section
              className={roomStyles.roomCategoriesPanel}
              style={{ border: "1px solid #ddd", borderRadius: 8, padding: 12, marginTop: 16 }}
            >'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one room categories section, found {text.count(old)}')
          page.write_text(text.replace(old, new))

          css_text = css.read_text()
          marker = '/* Premium / Super Premium room categories panel. */'
          if marker in css_text:
              raise SystemExit('Categories panel CSS already present')
          css_b64 = ''
          css.write_text(css_text + '\n' + base64.b64decode(css_b64).decode())
          PY

      - name: Validate diff
        run: |
          git diff --check
          git diff -- app/src/app/room/'[code]'/page.tsx app/src/app/room/'[code]'/page.module.css

      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-premium-categories-design.yml
          git add app/src/app/room/'[code]'/page.tsx app/src/app/room/'[code]'/page.module.css
          git commit -m "Redesign room categories panel"
          git push