name: Replace entry Free limit boxes
on:
  push:
    branches: [fix/scoring-free-limit-and-table-fit]
    paths: [.github/workflows/replace-entry-free-limit.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scoring-free-limit-and-table-fit
      - name: Replace legacy entry boxes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/app/room/[code]/page.tsx')
          s = p.read_text()

          pattern = re.compile(
              r'<section\s+style=\{\{\s*'
              r'padding:\s*14,\s*'
              r'border:\s*"2px solid #f59e0b",\s*'
              r'borderRadius:\s*10,\s*'
              r'background:\s*"#fff7ed",\s*'
              r'\}\}\s*>\s*'
              r'<h3[^>]*>\{t\("freeLimitTitle"\)\}</h3>\s*'
              r'<p>\{t\("freeLimitText"\)\}</p>.*?</section>',
              re.S,
          )

          replacement = '''<FreeLimitPanel
              language={uiLanguage}
              purchaseDisabled={categoryPurchaseBusy !== null || showRewardedAdPlaceholder}
              rewardDisabled={showRewardedAdPlaceholder || categoryPurchaseBusy !== null}
              onBuyPremium={() => void startPremiumPurchase()}
              onBuySuperPremium={() => void startSuperPremiumPurchase()}
              onWatchRewarded={() => void startFreeRewardedAd()}
            />'''

          s, count = pattern.subn(replacement, s)
          if count != 2:
            raise SystemExit(f'Expected 2 legacy entry Free limit boxes, replaced {count}')

          p.write_text(s)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'app/src/app/room/[code]/page.tsx'
          git commit -m 'Use shared Free limit panel on room entry'
          git push
