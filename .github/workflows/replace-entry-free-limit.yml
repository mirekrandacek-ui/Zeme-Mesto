name: Replace entry Free limit boxes
on:
  push:
    branches: [fix/scoring-free-limit-and-table-fit]
    paths: [.github/workflows/replace-entry-free-limit.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scoring-free-limit-and-table-fit
      - name: Replace legacy entry boxes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/src/app/room/[code]/page.tsx')
          s = p.read_text()

          replacement = '''<FreeLimitPanel
              language={uiLanguage}
              purchaseDisabled={categoryPurchaseBusy !== null || showRewardedAdPlaceholder}
              rewardDisabled={showRewardedAdPlaceholder || categoryPurchaseBusy !== null}
              onBuyPremium={() => void startPremiumPurchase()}
              onBuySuperPremium={() => void startSuperPremiumPurchase()}
              onWatchRewarded={() => void startFreeRewardedAd()}
            />'''

          count = 0
          search_from = 0
          while True:
            pos = s.find('background: "#fff7ed"', search_from)
            if pos < 0:
              break
            start = s.rfind('<section', 0, pos)
            end = s.find('</section>', pos)
            if start < 0 or end < 0:
              raise SystemExit('Could not locate legacy Free limit section bounds')
            end += len('</section>')
            segment = s[start:end]
            if 'freeLimitTitle' in segment and 'freeLimitText' in segment:
              s = s[:start] + replacement + s[end:]
              count += 1
              search_from = start + len(replacement)
            else:
              search_from = pos + 1

          if count < 1:
            raise SystemExit('No legacy entry Free limit box found')

          print(f'Replaced {count} legacy entry Free limit box(es)')
          p.write_text(s)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'app/src/app/room/[code]/page.tsx'
          git commit -m 'Use shared Free limit panel on room entry'
          git push
