name: Fix Premium lock preview scope

on:
  push:
    branches:
      - design/premium-categories-panel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel

      - name: Fix preview-only scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/app/room/[code]/page.tsx')
          text = p.read_text()

          wrong_lobby = '        {isOrganizer && (roomTierForCategoryPreview === "premium" || roomTierForCategoryPreview === "super_premium") && ('
          right_lobby = '        {isOrganizer && (roomTier === "premium" || roomTier === "super_premium") && ('
          if wrong_lobby not in text:
            raise SystemExit('Unexpected lobby preview line not found')
          text = text.replace(wrong_lobby, right_lobby, 1)

          old_extended = '              {(roomTier === "premium" || roomTier === "super_premium") && ('
          new_extended = '              {(roomTierForCategoryPreview === "premium" || roomTierForCategoryPreview === "super_premium") && ('
          if old_extended not in text:
            raise SystemExit('Extended categories condition not found')
          text = text.replace(old_extended, new_extended, 1)

          p.write_text(text)
          PY

      - name: Validate diff
        run: |
          git diff --check
          git diff -- app/src/app/room/'[code]'/page.tsx

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-premium-lock-preview-scope.yml
          git add app/src/app/room/'[code]'/page.tsx
          git commit -m "Fix Premium lock preview scope"
          git push
