name: Patch Super Premium bullet font
on:
  push:
    branches: [design/premium-categories-panel]
    paths: [.github/workflows/patch-super-premium-bullet-font.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel
      - name: Match bullet font to sales copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/app/page.module.css')
          s=p.read_text()
          marker='.purchaseOptions p{font-size:10px;line-height:1.25}'
          add=marker+'.purchaseOptions ul{font-size:10px;line-height:1.25}.purchaseOptions li{font-size:inherit;line-height:inherit}'
          if '.purchaseOptions ul{font-size:10px;line-height:1.25}' not in s:
              if marker not in s:
                  raise SystemExit('purchaseOptions paragraph style not found')
              s=s.replace(marker,add,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/app/page.module.css
          git commit -m 'Match Super Premium bullet font size' || exit 0
          git push
