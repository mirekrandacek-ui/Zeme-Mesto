name: Apply Free limit back home and buy copy

on:
  push:
    branches:
      - design/free-limit-back-home-buy-copy
    paths:
      - .github/workflows/apply-free-limit-back-home-buy-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/free-limit-back-home-buy-copy
      - name: Apply focused patch
        run: python3 .github/scripts/apply-free-limit-back-home-buy-copy.py
      - name: Validate diff
        run: git diff --check
      - name: Commit focused patch
        run: |
          git rm .github/workflows/apply-free-limit-back-home-buy-copy.yml .github/scripts/apply-free-limit-back-home-buy-copy.py
          git add app/src/app/room/'[code]'/page.tsx app/src/app/room/'[code]'/uiText.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sjednotit Zpět a upravit nákupní texty'
          git push origin HEAD:design/free-limit-back-home-buy-copy
