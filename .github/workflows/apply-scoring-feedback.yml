name: Apply scoring feedback

on:
  push:
    branches:
      - design/scoring-screen-compact
    paths:
      - .github/workflows/apply-scoring-feedback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/scoring-screen-compact
      - name: Apply focused feedback patch
        run: python3 scripts/apply_scoring_feedback_temp.py
      - name: Validate diff
        run: git diff --check
      - name: Commit focused patch
        run: |
          git rm -f .github/workflows/apply-scoring-feedback.yml scripts/apply_scoring_feedback_temp.py
          git add app/src/app/room/'[code]'/page.tsx app/src/app/room/'[code]'/page.module.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Doladit tabulku bodování'
          git push origin HEAD:design/scoring-screen-compact
