name: Patch Vercel favicon

on:
  push:
    branches:
      - fix/vercel-favicon

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vercel-favicon
          fetch-depth: 0

      - name: Build favicon from approved launcher icon
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path('app/assets/launcher/final-globe-stop3.png')
          target = Path('app/src/app/favicon.ico')

          image = Image.open(source).convert('RGBA')
          if image.width != image.height:
              size = min(image.width, image.height)
              left = (image.width - size) // 2
              top = (image.height - size) // 2
              image = image.crop((left, top, left + size, top + size))

          image.save(
              target,
              format='ICO',
              sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )
          PY

          git rm .github/workflows/patch-vercel-favicon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/app/favicon.ico
          git commit -m "Use globe launcher icon as web favicon"
          git push origin HEAD:fix/vercel-favicon
