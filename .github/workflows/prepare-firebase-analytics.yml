name: Prepare Firebase Analytics SDK

on:
  push:
    branches:
      - feat/firebase-analytics-sdk

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/firebase-analytics-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Firebase Analytics plugin
        working-directory: app
        run: npm install @capacitor-firebase/analytics@8.5.2 firebase@12.19.0

      - name: Sync Capacitor Android
        working-directory: app
        run: npx cap sync android

      - name: Commit generated dependency changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/package-lock.json app/android
          git status --short
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Add Firebase Analytics SDK"
          git push origin HEAD:feat/firebase-analytics-sdk
