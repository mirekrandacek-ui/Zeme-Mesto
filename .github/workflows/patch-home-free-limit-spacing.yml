name: Patch homepage Free limit spacing
on:
  push:
    branches: [design/premium-categories-panel]
    paths: [.github/workflows/patch-home-free-limit-spacing.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel
      - name: Increase spacing below purchase buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/app/page.tsx')
          s = p.read_text()
          s = s.replace('<p>{h("premiumDescription")}</p>', '<p style={{ marginTop: 8 }}>{h("premiumDescription")}</p>', 1)
          s = s.replace('<p>{h("superPremiumPurchaseDescription")}</p>', '<p style={{ marginTop: 8 }}>{h("superPremiumPurchaseDescription")}</p>', 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/app/page.tsx
          git commit -m 'Increase spacing below homepage purchase buttons' || exit 0
          git push
