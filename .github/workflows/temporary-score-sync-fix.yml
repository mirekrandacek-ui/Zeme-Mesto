name: Apply Free limit score sync fix

on:
  push:
    branches:
      - fix/free-limit-score-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/free-limit-score-sync

      - name: Keep final scoring synced before Free limit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/app/room/[code]/page.tsx')
          text = path.read_text(encoding='utf-8')
          old_submit = '    setMyScoreSubmitted(true);\n    setMsg("");\n    await loadAllScores(roomId, round.round_no);\n    await loadRoomScores(roomId);\n'
          new_submit = '    setMyScoreSubmitted(true);\n    setMsg("");\n\n    // Nejdřív synchronizuj celkové skóre. Free limit se může zobrazit až potom.\n    await loadRoomScores(roomId);\n    await loadAllScores(roomId, round.round_no);\n'
          if text.count(old_submit) != 1:
              raise SystemExit('submitScores block not found exactly once')
          text = text.replace(old_submit, new_submit)
          old_poll = '      await loadPlayers(roomId);\n      await loadCurrentRound(roomId);\n\n      if (round?.round_no) {\n        await loadAllAnswers(roomId, round.round_no);\n        await loadAllScores(roomId, round.round_no);\n    await loadRoomScores(roomId);\n      }\n\n      await loadRoomScores(roomId);\n'
          new_poll = '      await loadPlayers(roomId);\n      await loadCurrentRound(roomId);\n\n      // Celkové skóre načti dřív, než allScores může přepnout UI do Free limitu.\n      await loadRoomScores(roomId);\n\n      if (round?.round_no) {\n        await loadAllAnswers(roomId, round.round_no);\n        await loadAllScores(roomId, round.round_no);\n      }\n'
          if text.count(old_poll) != 1:
              raise SystemExit('polling score block not found exactly once')
          text = text.replace(old_poll, new_poll)
          old_reward = '    const nextQuota = unlockFreeRoundBlock();\n    setFreeRoundsRemaining(nextQuota.remainingRounds);\n\n    setShowFreeLimitUpsell(false);\n'
          new_reward = '    const nextQuota = unlockFreeRoundBlock();\n    setFreeRoundsRemaining(nextQuota.remainingRounds);\n\n    // Po návratu z nativní rewarded reklamy znovu potvrď poslední uložené body.\n    await loadRoomScores(roomId);\n\n    setShowFreeLimitUpsell(false);\n'
          if text.count(old_reward) != 1:
              raise SystemExit('rewarded unlock block not found exactly once')
          text = text.replace(old_reward, new_reward)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/temporary-score-sync-fix.yml').unlink()
          PY

      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Keep final round score before Free limit'
          git push origin HEAD:fix/free-limit-score-sync
