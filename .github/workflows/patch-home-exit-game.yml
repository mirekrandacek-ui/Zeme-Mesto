name: Patch home exit game

on:
  push:
    branches:
      - feat/home-exit-game

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-exit-game
          fetch-depth: 0

      - name: Patch files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          page=Path('app/src/app/page.tsx')
          text=page.read_text()
          text=text.replace('import FreeLimitPanel from "@/app/components/FreeLimitPanel";\n','import FreeLimitPanel from "@/app/components/FreeLimitPanel";\nimport { exitAndroidApp, isAppExitAvailable } from "@/lib/appControl";\n',1)
          replacements=[('    privacyPolicy: "Zásady ochrany soukromí",','    privacyPolicy: "Zásady ochrany soukromí",\n    exitGame: "Ukončit hru",'),('    privacyPolicy: "Privacy Policy",','    privacyPolicy: "Privacy Policy",\n    exitGame: "Exit game",'),('    privacyPolicy: "Política de privacidad",','    privacyPolicy: "Política de privacidad",\n    exitGame: "Salir del juego",'),('    privacyPolicy: "Datenschutzerklärung",','    privacyPolicy: "Datenschutzerklärung",\n    exitGame: "Spiel beenden",'),('    privacyPolicy: "Politique de confidentialité",','    privacyPolicy: "Politique de confidentialité",\n    exitGame: "Quitter le jeu",'),('    privacyPolicy: "Política de Privacidade",','    privacyPolicy: "Política de Privacidade",\n    exitGame: "Sair do jogo",'),('    privacyPolicy: "Kebijakan Privasi",','    privacyPolicy: "Kebijakan Privasi",\n    exitGame: "Keluar dari permainan",'),('    privacyPolicy: "Gizlilik Politikası",','    privacyPolicy: "Gizlilik Politikası",\n    exitGame: "Oyundan çık",'),('    privacyPolicy: "Polityka prywatności",','    privacyPolicy: "Polityka prywatności",\n    exitGame: "Wyjdź z gry",'),('    privacyPolicy: "Informativa sulla privacy",','    privacyPolicy: "Informativa sulla privacy",\n    exitGame: "Esci dal gioco",')]
          for old,new in replacements:
              if old not in text: raise SystemExit('missing translation anchor: '+old)
              text=text.replace(old,new,1)
          old='  function joinRoomByCode() {\n    const cleaned = roomCodeInput\n'
          new='  async function exitGame() {\n    if (!isAppExitAvailable()) return;\n    await exitAndroidApp();\n  }\n\n  function joinRoomByCode() {\n    const cleaned = roomCodeInput\n'
          if old not in text: raise SystemExit('joinRoomByCode anchor not found')
          text=text.replace(old,new,1)
          old='        <p className={styles.privacy}><a href="/privacy">{h("privacyPolicy")}</a></p>\n'
          new='        <button type="button" className={styles.exitGameButton} onClick={() => void exitGame()}>\n          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9" /></svg>\n          <span>{h("exitGame")}</span>\n        </button>\n        <p className={styles.privacy}><a href="/privacy">{h("privacyPolicy")}</a></p>\n'
          if old not in text: raise SystemExit('privacy footer anchor not found')
          page.write_text(text.replace(old,new,1))
          css=Path('app/src/app/page.module.css')
          c=css.read_text()
          old='.privacy{margin:10px 0 0;text-align:center;font-size:11px}.privacy a{color:#fff;text-underline-offset:3px}'
          new='.exitGameButton{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:40px;margin:8px auto 0;padding:7px 12px;border:2px solid #49c8ff;border-radius:14px;color:#fff;background:linear-gradient(#075f99,#003f72 58%,#002b55);box-shadow:inset 0 2px 4px #55cfff,inset 0 -4px 6px #001f43,0 0 0 2px #002d52,0 4px 7px #001126;font-size:12px;font-weight:700;text-shadow:0 2px 2px #00152d}.exitGameButton svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.privacy{margin:10px 0 0;text-align:center;font-size:11px}.privacy a{color:#fff;text-underline-offset:3px}'
          if old not in c: raise SystemExit('privacy css anchor not found')
          css.write_text(c.replace(old,new,1))
          Path('app/src/lib/appControl.ts').write_bytes(base64.b64decode(''))
          Path('app/android/app/src/main/java/com/randis2288/zememesto/AppControlPlugin.java').write_bytes(base64.b64decode(''))
          main=Path('app/android/app/src/main/java/com/randis2288/zememesto/MainActivity.java')
          m=main.read_text()
          old='        registerPlugin(PlayBillingPlugin.class);\n'
          if old not in m: raise SystemExit('MainActivity anchor not found')
          main.write_text(m.replace(old,old+'        registerPlugin(AppControlPlugin.class);\n',1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/patch-home-exit-game.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/app/page.tsx app/src/app/page.module.css app/src/lib/appControl.ts app/android/app/src/main/java/com/randis2288/zememesto/AppControlPlugin.java app/android/app/src/main/java/com/randis2288/zememesto/MainActivity.java .github/workflows/patch-home-exit-game.yml
          git commit -m "Add Android exit game action on homepage"
          git push origin HEAD:feat/home-exit-game
