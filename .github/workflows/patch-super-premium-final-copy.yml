name: Patch Super Premium final copy

on:
  push:
    branches:
      - design/premium-categories-panel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel

      - name: Update Super Premium copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          langs = {
            'cs': 'Super Premium: neomezený počet hráčů, základní kategorie, rozšířené kategorie Film / Seriál, Sport, Značka a Auto / Moto. Další kategorie a herní možnosti si postupně odemykáš za coiny získané pravidelným hraním.',
            'en': 'Super Premium: unlimited players, basic categories, and the extended categories Film / Series, Sport, Brand, and Car / Motorbike. You gradually unlock more categories and game options with coins earned through regular play.',
            'es': 'Super Premium: jugadores ilimitados, categorías básicas y las categorías ampliadas Película / Serie, Deporte, Marca y Coche / Moto. Desbloqueas poco a poco más categorías y opciones de juego con monedas obtenidas jugando con regularidad.',
            'de': 'Super Premium: unbegrenzt viele Spieler, Grundkategorien sowie die erweiterten Kategorien Film / Serie, Sportart, Marke und Auto / Motorrad. Weitere Kategorien und Spieloptionen schaltest du nach und nach mit Coins frei, die du durch regelmäßiges Spielen verdienst.',
            'fr': 'Super Premium : nombre de joueurs illimité, catégories de base et catégories supplémentaires Film / Série, Sport, Marque et Voiture / Moto. Tu débloques progressivement d’autres catégories et options de jeu avec des pièces gagnées en jouant régulièrement.',
            'pt-BR': 'Super Premium: jogadores ilimitados, categorias básicas e as categorias adicionais Filme / Série, Esporte, Marca e Carro / Moto. Você libera gradualmente mais categorias e opções de jogo com moedas ganhas jogando regularmente.',
            'id': 'Super Premium: pemain tanpa batas, kategori dasar, serta kategori tambahan Film / Serial, Olahraga, Merek, dan Mobil / Motor. Kamu membuka lebih banyak kategori dan opsi permainan secara bertahap dengan koin yang diperoleh dari bermain secara rutin.',
            'tr': 'Super Premium: sınırsız oyuncu, temel kategoriler ve Film / Dizi, Spor, Marka ile Araba / Motosiklet ek kategorileri. Düzenli oynayarak kazandığın coinlerle zamanla daha fazla kategori ve oyun seçeneğinin kilidini açarsın.',
            'pl': 'Super Premium: nieograniczona liczba graczy, kategorie podstawowe oraz kategorie rozszerzone Film / Serial, Sport, Marka i Samochód / Motocykl. Kolejne kategorie i opcje gry odblokowujesz stopniowo za monety zdobywane podczas regularnej gry.',
            'it': 'Super Premium: giocatori illimitati, categorie base e le categorie estese Film / Serie TV, Sport, Marca e Auto / Moto. Sblocchi gradualmente altre categorie e opzioni di gioco con le monete guadagnate giocando regolarmente.',
          }

          order = ['cs','en','es','de','fr','pt-BR','id','tr','pl','it']

          def replace_key_sequence(text, key, values):
            pattern = re.compile(rf'({re.escape(key)}:\s*\n?\s*")([^"]*)(",)')
            matches = list(pattern.finditer(text))
            if len(matches) != len(values):
              raise SystemExit(f'{key}: expected {len(values)} matches, found {len(matches)}')
            it = iter(values)
            return pattern.sub(lambda m: m.group(1) + next(it) + m.group(3), text)

          home = Path('app/src/app/page.tsx')
          h = home.read_text()
          vals = [langs[k] for k in order]
          h = replace_key_sequence(h, 'superPremiumDescription', vals)
          h = replace_key_sequence(h, 'superPremiumPurchaseDescription', vals)

          category_lines = {
            'cs': 'Kategorie v Super Premium: základní kategorie + Film / Seriál, Sport, Značka, Auto / Moto.',
            'en': 'Categories in Super Premium: basic categories + Film / Series, Sport, Brand, Car / Motorbike.',
            'es': 'Categorías en Super Premium: categorías básicas + Película / Serie, Deporte, Marca, Coche / Moto.',
            'de': 'Kategorien in Super Premium: Grundkategorien + Film / Serie, Sportart, Marke, Auto / Motorrad.',
            'fr': 'Catégories dans Super Premium : catégories de base + Film / Série, Sport, Marque, Voiture / Moto.',
            'pt-BR': 'Categorias no Super Premium: categorias básicas + Filme / Série, Esporte, Marca, Carro / Moto.',
            'id': 'Kategori di Super Premium: kategori dasar + Film / Serial, Olahraga, Merek, Mobil / Motor.',
            'tr': 'Super Premium kategorileri: temel kategoriler + Film / Dizi, Spor, Marka, Araba / Motosiklet.',
            'pl': 'Kategorie w Super Premium: kategorie podstawowe + Film / Serial, Sport, Marka, Samochód / Motocykl.',
            'it': 'Categorie in Super Premium: categorie base + Film / Serie TV, Sport, Marca, Auto / Moto.',
          }
          h = replace_key_sequence(h, 'superPremiumCategories', [category_lines[k] for k in order])
          home.write_text(h)

          ui = Path('app/src/app/room/[code]/uiText.ts')
          u = ui.read_text()

          upsell = {
            'cs': 'a získáš neomezený počet hráčů, základní kategorie, rozšířené kategorie Film / Seriál, Sport, Značka a Auto / Moto. Další kategorie a herní možnosti si postupně odemykáš za coiny získané pravidelným hraním.',
            'en': 'and get unlimited players, basic categories, and the extended categories Film / Series, Sport, Brand, and Car / Motorbike. You gradually unlock more categories and game options with coins earned through regular play.',
            'es': 'y obtén jugadores ilimitados, categorías básicas y las categorías ampliadas Película / Serie, Deporte, Marca y Coche / Moto. Desbloqueas poco a poco más categorías y opciones de juego con monedas obtenidas jugando con regularidad.',
            'de': 'und erhalte unbegrenzt viele Spieler, Grundkategorien sowie die erweiterten Kategorien Film / Serie, Sportart, Marke und Auto / Motorrad. Weitere Kategorien und Spieloptionen schaltest du nach und nach mit Coins frei, die du durch regelmäßiges Spielen verdienst.',
            'fr': 'et profite d’un nombre de joueurs illimité, des catégories de base et des catégories supplémentaires Film / Série, Sport, Marque et Voiture / Moto. Tu débloques progressivement d’autres catégories et options de jeu avec des pièces gagnées en jouant régulièrement.',
            'pt-BR': 'e tenha jogadores ilimitados, categorias básicas e as categorias adicionais Filme / Série, Esporte, Marca e Carro / Moto. Você libera gradualmente mais categorias e opções de jogo com moedas ganhas jogando regularmente.',
            'id': 'dan dapatkan pemain tanpa batas, kategori dasar, serta kategori tambahan Film / Serial, Olahraga, Merek, dan Mobil / Motor. Kamu membuka lebih banyak kategori dan opsi permainan secara bertahap dengan koin yang diperoleh dari bermain secara rutin.',
            'tr': 've sınırsız oyuncu, temel kategoriler ile Film / Dizi, Spor, Marka ve Araba / Motosiklet ek kategorilerini kazan. Düzenli oynayarak kazandığın coinlerle zamanla daha fazla kategori ve oyun seçeneğinin kilidini açarsın.',
            'pl': 'i zyskaj nieograniczoną liczbę graczy, kategorie podstawowe oraz kategorie rozszerzone Film / Serial, Sport, Marka i Samochód / Motocykl. Kolejne kategorie i opcje gry odblokowujesz stopniowo za monety zdobywane podczas regularnej gry.',
            'it': 'e ottieni giocatori illimitati, categorie base e le categorie estese Film / Serie TV, Sport, Marca e Auto / Moto. Sblocchi gradualmente altre categorie e opzioni di gioco con le monete guadagnate giocando regolarmente.',
          }
          u = replace_key_sequence(u, 'superPremiumUpsellAfter', [upsell[k] for k in order])

          help_pattern = re.compile(r'(superPremiumOrganizer:\s*\n?\s*")([^"]*)(",)')
          help_matches = list(help_pattern.finditer(u))
          if len(help_matches) != 10:
            raise SystemExit(f'superPremiumOrganizer: expected 10 matches, found {len(help_matches)}')
          it = iter(vals)
          u = help_pattern.sub(lambda m: m.group(1) + next(it) + m.group(3), u)
          ui.write_text(u)
          PY

      - name: Validate
        run: git diff --check

      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-super-premium-final-copy.yml
          git add app/src/app/page.tsx app/src/app/room/'[code]'/uiText.ts
          git commit -m "Finalize Super Premium copy"
          git push
