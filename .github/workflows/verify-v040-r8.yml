name: Verify v040 R8 bundle

on:
  push:
    branches:
      - fix/r8-deobfuscation-v040

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android 36 SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build R8 release bundle
        shell: bash
        run: |
          set -euxo pipefail
          sed -i '/signingConfig signingConfigs.release/d' app/android/app/build.gradle
          cd app/android
          chmod +x gradlew
          ./gradlew :app:bundleRelease --console=plain

      - name: Verify mapping
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/android/app/build/outputs/mapping/release/mapping.txt
          unzip -l app/android/app/build/outputs/bundle/release/app-release.aab | grep -E 'BUNDLE-METADATA/.*/proguard|BUNDLE-METADATA/.*/mapping'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeme-mesto-v040-r8
          path: |
            app/android/app/build/outputs/bundle/release/app-release.aab
            app/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
