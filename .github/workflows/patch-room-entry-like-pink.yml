name: Patch room entry Like box

on:
  push:
    branches:
      - fix/room-entry-like-pink

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/room-entry-like-pink
          fetch-depth: 0

      - name: Apply exact Like box patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/app/room/[code]/page.tsx')
          text = path.read_text(encoding='utf-8')

          style_anchor = '            className={roomStyles.entryLike}\n            onClick={() => window.alert(t("ratingUnavailable"))}'
          style_replacement = (
              '            className={roomStyles.entryLike}\n'
              '            style={{\n'
              '              height: 52,\n'
              '              minHeight: 52,\n'
              '              justifyContent: "flex-start",\n'
              '              paddingTop: 5,\n'
              '              paddingBottom: 5,\n'
              '              borderColor: "#ffd0dc",\n'
              '              background: "linear-gradient(#f7afc4,#e58daa 55%,#cc6f92)",\n'
              '              boxShadow:\n'
              '                "inset 0 3px 5px #ffe8ef,inset 0 -5px 7px #a85171,0 0 0 2px #9d536d,0 5px 7px #00152d",\n'
              '            }}\n'
              '            onClick={() => window.alert(t("ratingUnavailable"))}'
          )

          if text.count(style_anchor) != 1:
              raise SystemExit(f'Like style anchor count: {text.count(style_anchor)}')
          text = text.replace(style_anchor, style_replacement, 1)

          heart_anchor = '            <span className={roomStyles.entryLikeCopy}>{t("likeApp")}</span>\n            <span className={roomStyles.entryHeart}>♥</span>'
          heart_replacement = '            <span className={roomStyles.entryLikeCopy}>{t("likeApp")} ❤️</span>'

          if text.count(heart_anchor) != 1:
              raise SystemExit(f'Like heart anchor count: {text.count(heart_anchor)}')
          text = text.replace(heart_anchor, heart_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/patch-room-entry-like-pink.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/src/app/room/[code]/page.tsx'
          git commit -m "Match room entry Like box to homepage"
          git push origin HEAD:fix/room-entry-like-pink
