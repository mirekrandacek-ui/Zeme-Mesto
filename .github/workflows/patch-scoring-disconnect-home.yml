name: Patch scoring disconnect home

on:
  push:
    branches:
      - fix/scoring-disconnect-home

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scoring-disconnect-home
          fetch-depth: 0

      - name: Apply patch
        run: python .github/patch_scoring_disconnect.py

      - name: Commit patch and clean temporary files
        run: |
          rm .github/patch_scoring_disconnect.py
          rm .github/workflows/patch-scoring-disconnect-home.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add scoring disconnect back to home"
          git push origin HEAD:fix/scoring-disconnect-home
