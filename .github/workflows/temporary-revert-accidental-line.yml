name: Temporary cleanup

on:
  push:
    branches:
      - fix/free-limit-purchase-like-copy

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/free-limit-purchase-like-copy
      - name: Revert accidental text change
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/app/room/[code]/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'en: "❌ The new round could not be loaded.",'
          new = 'en: "❌ The round could not be loaded.",'
          if text.count(old) != 1:
              raise SystemExit('Expected accidental line exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/src/app/room/[code]/page.tsx'
          git commit -m 'Revert unrelated round error wording'
          git push origin HEAD:fix/free-limit-purchase-like-copy
