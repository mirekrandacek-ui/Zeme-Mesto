name: Apply Premium preview cleanup

on:
  push:
    branches:
      - design/premium-categories-panel

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel

      - name: Normalize Premium preview categories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/app/room/[code]/page.tsx')
          s = p.read_text()
          old = '    setActiveCategories((current) => uniqueNonEmpty([...PREMIUM_CATEGORIES, ...current]));\n  }, [premiumPreviewLockTest]);'
          new = '''    setActiveCategories((current) =>
      uniqueNonEmpty([
        ...PREMIUM_CATEGORIES,
        ...current.filter((category) =>
          ownedCategoryProductIds.includes(CATEGORY_PRODUCT_ID[category])
        ),
      ])
    );
  }, [premiumPreviewLockTest, ownedCategoryProductIds]);'''
          if old not in s:
              raise SystemExit('Premium preview normalization block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-premium-preview-stale-locked.yml
          git add app/src/app/room/'[code]'/page.tsx
          git commit -m "Normalize locked categories in Premium preview"
          git push