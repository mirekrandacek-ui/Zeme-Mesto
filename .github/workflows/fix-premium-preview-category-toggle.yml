name: Apply Premium preview toggle

on:
  push:
    branches:
      - design/premium-categories-panel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-categories-panel
      - name: Patch
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/app/room/[code]/page.tsx"); s=p.read_text(); old="(roomTier === \"super_premium\" || premiumCategorySelectionUnlocked);"; new="(roomTier === \"super_premium\" || premiumCategorySelectionUnlocked || premiumPreviewLockTest);"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-premium-preview-category-toggle.yml
          git add app/src/app/room/'[code]'/page.tsx
          git commit -m "Enable purchased categories in Premium preview"
          git push