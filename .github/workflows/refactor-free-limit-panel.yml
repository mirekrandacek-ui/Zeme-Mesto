name: Refactor shared Free limit panel
on:
  push:
    branches: [fix/scoring-free-limit-and-table-fit]
    paths: [.github/workflows/refactor-free-limit-panel.yml]
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scoring-free-limit-and-table-fit
          fetch-depth: 0
      - name: Build shared Free limit panel
        run: |
          git fetch origin main
          git checkout origin/main -- 'app/src/app/room/[code]/page.module.css'

          mkdir -p app/src/app/components
          cat > app/src/app/components/FreeLimitPanel.module.css <<'EOF'
          .panel{
            position:relative;
            z-index:2;
            margin-top:8px;
            padding:8px;
            border:1.5px solid #ffd75d;
            border-radius:10px;
            color:#fff;
            background:#513100cf;
            font-family:Arial,Helvetica,sans-serif;
            font-size:11.5px;
            line-height:1.35;
            text-align:left;
            text-shadow:0 2px 3px #00152d;
          }

          .panel h3,
          .panel p{
            margin:0 0 5px;
          }

          .separator{
            height:1px;
            margin:12px 0;
            background:rgba(160,220,255,.65);
          }

          .button{
            width:100%;
            padding:8px;
            border:1px solid #b8ff8c;
            border-radius:9px;
            color:#fff;
            background:linear-gradient(#67ca35,#21880d);
            font-family:inherit;
            font-size:13px;
            font-weight:700;
            text-align:center;
            text-shadow:0 2px 2px #145c0d;
            cursor:pointer;
          }

          .button:disabled{
            filter:grayscale(.7);
            opacity:.7;
            cursor:default;
          }

          .description{
            margin-top:8px!important;
            font-size:inherit;
            line-height:1.35;
          }

          .benefitsIntro{
            font-size:inherit;
            line-height:1.35;
          }

          .benefits{
            font-size:inherit;
            line-height:1.35;
          }

          .rewardLine{
            display:block;
            text-align:center;
          }

          .footer{
            margin-top:14px;
          }
          EOF

          cat > app/src/app/components/FreeLimitPanel.tsx <<'EOF'
          "use client";

          import type { ReactNode } from "react";
          import { getUiText, type UiLanguage } from "@/app/room/[code]/uiText";
          import styles from "./FreeLimitPanel.module.css";

          type FreeLimitPanelProps = {
            language: UiLanguage;
            purchaseDisabled?: boolean;
            rewardDisabled?: boolean;
            onBuyPremium: () => void;
            onBuySuperPremium: () => void;
            onWatchRewarded: () => void;
            footer?: ReactNode;
          };

          export default function FreeLimitPanel({
            language,
            purchaseDisabled = false,
            rewardDisabled = false,
            onBuyPremium,
            onBuySuperPremium,
            onWatchRewarded,
            footer,
          }: FreeLimitPanelProps) {
            const t = (key: Parameters<typeof getUiText>[1]) => getUiText(language, key);

            return (
              <section className={styles.panel}>
                <h3>{t("freeLimitTitle")}</h3>
                <p>{t("freeLimitText")}</p>

                <div className={styles.separator} />
                <button type="button" className={styles.button} disabled={purchaseDisabled} onClick={onBuyPremium}>
                  {t("freeUpgradeButton")}
                </button>
                <p className={styles.description}>{t("premiumPurchaseDescription")}</p>

                <div className={styles.separator} />
                <button type="button" className={styles.button} disabled={purchaseDisabled} onClick={onBuySuperPremium}>
                  {t("buySuperPremium")}
                </button>
                <p className={styles.description}>{t("superPremiumPurchaseDescription")}</p>
                <p className={styles.benefitsIntro}>{t("superPremiumBenefitsIntro")}</p>
                <ul className={styles.benefits}>
                  {t("superPremiumBenefits").split("|").map((benefit) => (
                    <li key={benefit}>{benefit}</li>
                  ))}
                </ul>

                <div className={styles.separator} />
                <button type="button" className={styles.button} disabled={rewardDisabled} onClick={onWatchRewarded}>
                  <span className={styles.rewardLine}>{t("freeRewardButtonLine1")}</span>
                  <span className={styles.rewardLine}>{t("freeRewardButtonLine2")}</span>
                </button>

                {footer ? <div className={styles.footer}>{footer}</div> : null}
              </section>
            );
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          ui_path = Path('app/src/app/room/[code]/uiText.ts')
          ui = ui_path.read_text()

          copy = {
            'cs': ('Až 5 hráčů. Pevně dané základní kategorie: Země, Město, Jméno, Zvíře, Věc, Rostlina.', 'Neomezený počet hráčů, volitelné základní kategorie a 4 rozšířené kategorie Film / Seriál, Sport, Značka a Auto / Moto.', 'Koupit Super Premium'),
            'en': ('Up to 5 players. Fixed basic categories: Country, City, Name, Animal, Thing, Plant.', 'Unlimited players, optional basic categories and 4 extended categories: Film / Series, Sport, Brand and Car / Motorbike.', 'Buy Super Premium'),
            'es': ('Hasta 5 jugadores. Categorías básicas fijas: País, Ciudad, Nombre, Animal, Cosa, Planta.', 'Jugadores ilimitados, categorías básicas opcionales y 4 categorías ampliadas: Película / Serie, Deporte, Marca y Coche / Moto.', 'Comprar Super Premium'),
            'de': ('Bis zu 5 Spieler. Feste Grundkategorien: Land, Stadt, Name, Tier, Gegenstand, Pflanze.', 'Unbegrenzt viele Spieler, frei wählbare Grundkategorien und 4 erweiterte Kategorien: Film / Serie, Sportart, Marke und Auto / Motorrad.', 'Super Premium kaufen'),
            'fr': ('Jusqu’à 5 joueurs. Catégories de base fixes : Pays, Ville, Prénom, Animal, Objet, Plante.', 'Nombre de joueurs illimité, catégories de base au choix et 4 catégories supplémentaires : Film / Série, Sport, Marque et Voiture / Moto.', 'Acheter Super Premium'),
            'pt-BR': ('Até 5 jogadores. Categorias básicas fixas: País, Cidade, Nome, Animal, Objeto, Planta.', 'Jogadores ilimitados, categorias básicas opcionais e 4 categorias adicionais: Filme / Série, Esporte, Marca e Carro / Moto.', 'Comprar Super Premium'),
            'id': ('Hingga 5 pemain. Kategori dasar tetap: Negara, Kota, Nama, Hewan, Benda, Tanaman.', 'Pemain tanpa batas, kategori dasar yang dapat dipilih, serta 4 kategori tambahan: Film / Serial, Olahraga, Merek, dan Mobil / Motor.', 'Beli Super Premium'),
            'tr': ('5 oyuncuya kadar. Sabit temel kategoriler: Ülke, Şehir, İsim, Hayvan, Eşya, Bitki.', 'Sınırsız oyuncu, seçilebilir temel kategoriler ve 4 ek kategori: Film / Dizi, Spor, Marka ve Araba / Motosiklet.', 'Super Premium satın al'),
            'pl': ('Do 5 graczy. Stałe kategorie podstawowe: Państwo, Miasto, Imię, Zwierzę, Rzecz, Roślina.', 'Nieograniczona liczba graczy, dowolnie wybierane kategorie podstawowe oraz 4 kategorie rozszerzone: Film / Serial, Sport, Marka i Samochód / Motocykl.', 'Kup Super Premium'),
            'it': ('Fino a 5 giocatori. Categorie base fisse: Paese, Città, Nome, Animale, Oggetto, Pianta.', 'Giocatori illimitati, categorie base selezionabili e 4 categorie estese: Film / Serie TV, Sport, Marca e Auto / Moto.', 'Acquista Super Premium'),
          }

          if 'premiumPurchaseDescription:' not in ui:
            for lang, (premium, super_desc, buy_super) in copy.items():
              label = f'"{lang}"' if '-' in lang else lang
              pattern = rf'(  {re.escape(label)}: \{{.*?\n\s+freeUpgradeButton: "[^"]+",)'
              repl = rf'\1\n      premiumPurchaseDescription: "{premium}",\n      superPremiumPurchaseDescription: "{super_desc}",\n      buySuperPremium: "{buy_super}",'
              ui, count = re.subn(pattern, repl, ui, count=1, flags=re.S)
              if count != 1:
                raise SystemExit(f'Could not add shared purchase copy for {lang}')
          ui_path.write_text(ui)

          home_path = Path('app/src/app/page.tsx')
          home = home_path.read_text()
          import_line = 'import { getUiText as getRoomUiText } from "@/app/room/[code]/uiText";'
          if 'FreeLimitPanel from "@/app/components/FreeLimitPanel"' not in home:
            home = home.replace(import_line, import_line + '\nimport FreeLimitPanel from "@/app/components/FreeLimitPanel";', 1)

          start = home.index('          {freeQuotaExhausted && (\n            <section className={styles.rewardPanel}>')
          end_marker = '\n\n          <button className={styles.createButton}'
          end = home.index(end_marker, start)
          new_block = '''          {freeQuotaExhausted && (\n            <FreeLimitPanel\n              language={language}\n              purchaseDisabled={purchaseBusy !== null}\n              rewardDisabled={rewardedBusy}\n              onBuyPremium={() => void startPlayPurchase("premium")}\n              onBuySuperPremium={() => void startPlayPurchase("super_premium")}\n              onWatchRewarded={() => void startHomeFreeRewardedAd()}\n            />\n          )}'''
          home = home[:start] + new_block + home[end:]

          home = home.replace('{h("premiumDescription")}', '{getRoomUiText(language, "premiumPurchaseDescription")}')
          home = home.replace('{h("superPremiumPurchaseDescription")}', '{getRoomUiText(language, "superPremiumPurchaseDescription")}')
          home = home.replace('{h("superPremiumBenefitsIntro")}', '{getRoomUiText(language, "superPremiumBenefitsIntro")}')
          home = home.replace('h("superPremiumBenefits").split("|")', 'getRoomUiText(language, "superPremiumBenefits").split("|")')
          home = home.replace('h("buyPremium")', 'getRoomUiText(language, "freeUpgradeButton")')
          home = home.replace('h("buySuperPremium")', 'getRoomUiText(language, "buySuperPremium")')

          for key in ['premiumDescription', 'superPremiumPurchaseDescription', 'superPremiumBenefitsIntro', 'superPremiumBenefits', 'buyPremium', 'buySuperPremium']:
            pattern = rf'\n    {key}:\s*(?:\n      )?"(?:[^"\\]|\\.)*",'
            home, count = re.subn(pattern, '', home)
            if count != 10:
              raise SystemExit(f'Expected 10 HOME_TEXT removals for {key}, got {count}')
          home_path.write_text(home)

          room_path = Path('app/src/app/room/[code]/page.tsx')
          room = room_path.read_text()
          room_import = 'import roomStyles from "./page.module.css";'
          if 'FreeLimitPanel from "@/app/components/FreeLimitPanel"' not in room:
            room = room.replace(room_import, 'import FreeLimitPanel from "@/app/components/FreeLimitPanel";\n' + room_import, 1)

          section_start = room.index('                <section\n                  className={`${roomStyles.scoringNextArea} ${roomStyles.scoringFreeLimitPanel}`}')
          ternary_end = room.index('\n              ) : isFinalScoringRound ? (', section_start)
          section_end = room.rfind('                </section>', section_start, ternary_end) + len('                </section>')
          replacement = '''                <FreeLimitPanel\n                  language={uiLanguage}\n                  purchaseDisabled={!isOrganizer || categoryPurchaseBusy !== null}\n                  onBuyPremium={() => void startPremiumPurchase()}\n                  onBuySuperPremium={() => void startSuperPremiumPurchase()}\n                  onWatchRewarded={() => void startFreeRewardedAd()}\n                  footer={\n                    <>\n                      {showRewardedAdPlaceholder && (\n                        <section\n                          style={{\n                            marginTop: 10,\n                            padding: 12,\n                            border: "1px dashed #999",\n                            borderRadius: 8,\n                            background: "#fff",\n                            color: "#172033",\n                            textShadow: "none",\n                          }}\n                        >\n                          <p style={{ marginTop: 0, marginBottom: 6, fontWeight: 700 }}>\n                            {uiMessage({ cs: "Rewarded reklama běží…", en: "Rewarded ad is playing…", es: "El anuncio recompensado se está reproduciendo…", de: "Werbung mit Belohnung wird abgespielt…", fr: "Lecture de la publicité récompensée…", "pt-BR": "Reproduzindo anúncio com recompensa…", id: "Iklan berhadiah sedang diputar…", tr: "Ödüllü reklam oynatılıyor…", pl: "Trwa reklama z nagrodą…", it: "Riproduzione dell’annuncio con premio…" })}\n                          </p>\n                          <p style={{ margin: 0 }}>\n                            {uiMessage({ cs: "Po doběhnutí reklamy se automaticky odemknou další 3 kola.", en: "After the ad finishes, 3 more rounds will unlock automatically.", es: "Cuando termine el anuncio, se desbloquearán automáticamente 3 rondas más.", de: "Nach Ende der Werbung werden automatisch 3 weitere Runden freigeschaltet.", fr: "À la fin de la publicité, 3 manches supplémentaires seront automatiquement débloquées.", "pt-BR": "Quando o anúncio terminar, mais 3 rodadas serão liberadas automaticamente.", id: "Setelah iklan selesai, 3 ronde tambahan akan terbuka secara otomatis.", tr: "Reklam tamamlandığında 3 ek turun kilidi otomatik olarak açılacak.", pl: "Po zakończeniu reklamy automatycznie odblokują się 3 kolejne rundy.", it: "Al termine dell’annuncio, verranno sbloccati automaticamente altri 3 turni." })}\n                          </p>\n                        </section>\n                      )}\n                      <a\n                        className={`${roomStyles.entryAction} ${roomStyles.entryActionHome}`}\n                        href="/"\n                      >\n                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h11"/></svg>\n                        <span>{t("backHome")}</span>\n                      </a>\n                    </>\n                  }\n                />'''
          room = room[:section_start] + replacement + room[section_end:]
          room_path.write_text(room)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/app/components/FreeLimitPanel.tsx app/src/app/components/FreeLimitPanel.module.css app/src/app/page.tsx 'app/src/app/room/[code]/page.tsx' 'app/src/app/room/[code]/page.module.css' 'app/src/app/room/[code]/uiText.ts'
          git commit -m 'Share Free limit panel across homepage and scoring'
          git push