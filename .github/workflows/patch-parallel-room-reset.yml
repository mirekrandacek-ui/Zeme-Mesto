name: Patch parallel room reset

on:
  push:
    branches:
      - fix/parallel-room-reset

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/parallel-room-reset
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch_parallel_room_reset.py
      - name: Commit patch
        run: git rm .github/patch_parallel_room_reset.py .github/workflows/patch-parallel-room-reset.yml && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add 'app/src/app/room/[code]/page.tsx' && git commit -m "Parallelize room reset before first join" && git push origin HEAD:fix/parallel-room-reset
