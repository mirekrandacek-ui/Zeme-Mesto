name: Verify v041 adaptive banner insets

on:
  push:
    branches:
      - fix/banner-insets-v041

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies and apply native patch
        working-directory: app
        run: npm ci

      - name: Verify inset calculation scenarios
        working-directory: app
        run: npm run test:banner-insets

      - name: Verify native AdMob patch
        shell: bash
        run: |
          set -euxo pipefail
          FILE="app/node_modules/@capacitor-community/admob/android/src/main/java/com/getcapacitor/community/admob/banner/BannerExecutor.java"
          grep -q "ZEMEMESTO_INSET_PATCH_V041" "$FILE"
          ! grep -q "rootView.setOnApplyWindowInsetsListener" "$FILE"
          grep -q "navigationBars()" "$FILE"
          grep -q "bottomAlreadyHandled" "$FILE"

      - name: Sync Capacitor Android
        working-directory: app
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android 36 SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build R8 release bundle
        shell: bash
        run: |
          set -euxo pipefail
          sed -i '/signingConfig signingConfigs.release/d' app/android/app/build.gradle
          cd app/android
          chmod +x gradlew
          ./gradlew :app:bundleRelease --console=plain

      - name: Verify v041 and mapping
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "versionCode 41" app/android/app/build.gradle
          grep -q 'versionName "v041"' app/android/app/build.gradle
          test -s app/android/app/build/outputs/mapping/release/mapping.txt
          unzip -l app/android/app/build/outputs/bundle/release/app-release.aab | grep -E 'BUNDLE-METADATA/.*/proguard|BUNDLE-METADATA/.*/mapping'

      - name: Upload v041 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeme-mesto-v041-r8
          path: |
            app/android/app/build/outputs/bundle/release/app-release.aab
            app/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
