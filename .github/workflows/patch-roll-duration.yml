name: Shorten letter draw duration

on:
  push:
    branches:
      - fix/shorter-letter-draw

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shorter-letter-draw
          fetch-depth: 0

      - name: Apply exact draw duration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/app/room/[code]/page.tsx')
          text = path.read_text(encoding='utf-8')

          old = 'const ROLL_MS = 5000;'
          new = 'const ROLL_MS = 2500;'

          if text.count(old) != 1:
              raise SystemExit('Expected exactly one ROLL_MS = 5000 constant')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/patch-roll-duration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/src/app/room/[code]/page.tsx'
          git commit -m "Shorten letter draw duration"
          git push origin HEAD:fix/shorter-letter-draw
