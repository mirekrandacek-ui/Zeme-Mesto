name: Apply Android back exit confirmation

on:
  push:
    branches:
      - fix/android-back-exit-confirm

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-back-exit-confirm

      - name: Apply focused patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          page = Path('app/src/app/page.tsx')
          text = page.read_text()

          replacements = [
              ('import { exitAndroidApp, isAppExitAvailable } from "@/lib/appControl";\n', ''),
              ('  async function exitGame() {\n    if (!isAppExitAvailable()) return;\n    await exitAndroidApp();\n  }\n\n', ''),
              ('        <button type="button" className={styles.exitGameButton} onClick={() => void exitGame()}>\n          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9" /></svg>\n          <span>{h("exitGame")}</span>\n        </button>\n', ''),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one page.tsx match, found {text.count(old)}: {old[:80]!r}')
              text = text.replace(old, new)
          page.write_text(text)

          main = Path('app/android/app/src/main/java/com/randis2288/zememesto/MainActivity.java')
          text = main.read_text()

          old = 'import androidx.activity.result.ActivityResultLauncher;\n'
          new = 'import androidx.activity.OnBackPressedCallback;\nimport androidx.activity.result.ActivityResultLauncher;\n'
          if text.count(old) != 1:
              raise SystemExit('MainActivity import anchor mismatch')
          text = text.replace(old, new)

          old = '    private boolean completionDialogVisible = false;\n'
          new = '    private boolean completionDialogVisible = false;\n    private boolean exitDialogVisible = false;\n'
          if text.count(old) != 1:
              raise SystemExit('MainActivity field anchor mismatch')
          text = text.replace(old, new)

          old = '        registerPlugin(PlayBillingPlugin.class);\n        registerPlugin(AppControlPlugin.class);\n        super.onCreate(savedInstanceState);\n\n        appUpdateManager = AppUpdateManagerFactory.create(this);\n'
          new = '''        registerPlugin(PlayBillingPlugin.class);\n        super.onCreate(savedInstanceState);\n\n        getOnBackPressedDispatcher().addCallback(\n            this,\n            new OnBackPressedCallback(true) {\n                @Override\n                public void handleOnBackPressed() {\n                    showExitGameDialog();\n                }\n            }\n        );\n\n        appUpdateManager = AppUpdateManagerFactory.create(this);\n'''
          if text.count(old) != 1:
              raise SystemExit('MainActivity onCreate anchor mismatch')
          text = text.replace(old, new)

          anchor = '    private void checkForAppUpdate() {\n'
          method = '''    private void showExitGameDialog() {\n        if (exitDialogVisible || isFinishing() || isDestroyed()) {\n            return;\n        }\n\n        exitDialogVisible = true;\n\n        AlertDialog dialog = new AlertDialog.Builder(this)\n            .setMessage(\n                localizedText(\n                    "Ukončit hru?",\n                    "Exit game?",\n                    "¿Salir del juego?"\n                )\n            )\n            .setNegativeButton(\n                localizedText("Ano", "Yes", "Sí"),\n                (ignored, which) -> {\n                    exitDialogVisible = false;\n                    finishAndRemoveTask();\n                }\n            )\n            .setPositiveButton(\n                localizedText("Ne", "No", "No"),\n                (ignored, which) -> exitDialogVisible = false\n            )\n            .create();\n\n        dialog.setOnCancelListener(\n            ignored -> exitDialogVisible = false\n        );\n\n        dialog.show();\n    }\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('MainActivity method anchor mismatch')
          text = text.replace(anchor, method + anchor)
          main.write_text(text)

          for file_name in [
              'app/src/lib/appControl.ts',
              'app/android/app/src/main/java/com/randis2288/zememesto/AppControlPlugin.java',
          ]:
              path = Path(file_name)
              if not path.exists():
                  raise SystemExit(f'Missing expected file: {file_name}')
              path.unlink()
          PY

      - name: Verify focused change
        shell: bash
        run: |
          set -e
          ! grep -R "AppControlPlugin\|@/lib/appControl\|exitAndroidApp\|isAppExitAvailable\|exitGameButton" app/src app/android/app/src/main/java/com/randis2288/zememesto
          grep -q '"Ukončit hru?"' app/android/app/src/main/java/com/randis2288/zememesto/MainActivity.java
          grep -q 'localizedText("Ano", "Yes", "Sí")' app/android/app/src/main/java/com/randis2288/zememesto/MainActivity.java
          grep -q 'localizedText("Ne", "No", "No")' app/android/app/src/main/java/com/randis2288/zememesto/MainActivity.java
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-android-back-exit-confirm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/app/page.tsx app/src/lib/appControl.ts app/android/app/src/main/java/com/randis2288/zememesto/MainActivity.java app/android/app/src/main/java/com/randis2288/zememesto/AppControlPlugin.java
          git commit -m "Use Android back confirmation to exit game"
          git push origin HEAD:fix/android-back-exit-confirm
