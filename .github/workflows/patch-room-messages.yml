name: Patch room status messages

on:
  push:
    branches:
      - fix/hide-share-disconnect-messages

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hide-share-disconnect-messages
          fetch-depth: 0

      - name: Apply exact message patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/app/room/[code]/page.tsx')
          text = path.read_text(encoding='utf-8')

          start_marker = '    } catch {\n      setMsg(\n        uiMessage({ cs: "ℹ️ Sdílení bylo zrušeno."'
          end_marker = '    }\n  }\n\n  function saveMyPlayer'

          if text.count(start_marker) != 1:
              raise SystemExit('Expected exactly one cancelled-share message block')

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + '    } catch {\n      setMsg("");\n' + text[end:]

          old_room_cleared = '      setMsg(t("disconnectedRoomCleared"));'
          old_disconnected = '    setMsg(t("disconnected"));'

          if text.count(old_room_cleared) != 1:
              raise SystemExit('Expected exactly one disconnectedRoomCleared message')
          if text.count(old_disconnected) != 1:
              raise SystemExit('Expected exactly one disconnected message')

          text = text.replace(old_room_cleared, '      setMsg("");', 1)
          text = text.replace(old_disconnected, '    setMsg("");', 1)
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/patch-room-messages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/src/app/room/[code]/page.tsx'
          git commit -m "Hide share cancel and disconnect messages"
          git push origin HEAD:fix/hide-share-disconnect-messages
